<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Tracing Dashboard</title>
  <style>
    /* Reset */
    * {margin:0; padding:0; box-sizing:border-box;}
    body {
      font-family: 'Poppins', sans-serif;
      color: #fff;
      overflow-x: hidden;
      height: 100vh;
      background: #000;
    }

    /* Animated gradient mesh background */
    body::before {
      content: "";
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: radial-gradient(circle at 20% 30%, rgba(0,255,255,0.2), transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(255,0,255,0.2), transparent 40%),
                  radial-gradient(circle at 50% 50%, rgba(0,128,255,0.2), transparent 40%);
      animation: gradientFlow 20s ease infinite;
      z-index:-3;
    }

    @keyframes gradientFlow {
      0% {transform:scale(1) translate(0,0);}
      50% {transform:scale(1.2) translate(20px,-20px);}
      100% {transform:scale(1) translate(0,0);}
    }

    /* Floating glowing particles */
    .particle {
      position: fixed;
      width:6px; height:6px;
      background: cyan;
      border-radius:50%;
      opacity:0.7;
      animation: floatParticle 12s linear infinite;
      z-index:-2;
    }
    @keyframes floatParticle {
      from {transform:translateY(100vh) translateX(0);}
      to {transform:translateY(-10vh) translateX(50px);}
    }

    /* GPS radar pulse */
    .pulse {
      position: fixed;
      top:50%; left:50%;
      width:200px; height:200px;
      margin:-100px 0 0 -100px;
      border-radius:50%;
      background: rgba(0,255,255,0.1);
      border:2px solid cyan;
      animation: pulseAnim 3s infinite;
      z-index:-1;
    }
    @keyframes pulseAnim {
      0% {transform:scale(0.5); opacity:0.7;}
      70% {transform:scale(1.5); opacity:0;}
      100% {transform:scale(0.5); opacity:0;}
    }

    /* Glassmorphism container */
    .container {
      position: relative;
      margin: 20px auto;
      max-width: 900px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0,255,255,0.3);
    }

    h1 {
      text-align:center;
      margin-bottom:20px;
      font-size:2em;
      color: cyan;
      text-shadow:0 0 10px #0ff;
    }

    form {
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-bottom:20px;
    }
    input, button {
      padding:10px;
      border:none;
      border-radius:8px;
      font-size:1em;
    }
    input {
      background:rgba(255,255,255,0.1);
      color:#fff;
    }
    button {
      background:linear-gradient(90deg, #0ff, #80f, #0ff);
      color:#000;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }
    button:hover {
      filter:brightness(1.2);
    }

    #map {
      width:100%;
      height:400px;
      border-radius:12px;
      overflow:hidden;
    }

    /* Smooth transitions */
    .fade-in {
      animation: fadeIn 1s ease forwards;
    }
    @keyframes fadeIn {
      from {opacity:0;}
      to {opacity:1;}
    }

    /* Responsive */
    @media(max-width:768px){
      #map {height:300px;}
    }
    @media(max-width:480px){
      h1 {font-size:1.5em;}
      #map {height:250px;}
    }
  </style>
</head>
<body>
  <!-- Background effects -->
  <div class="pulse"></div>
  <div class="particle" style="left:10%; animation-delay:0s;"></div>
  <div class="particle" style="left:30%; animation-delay:2s;"></div>
  <div class="particle" style="left:50%; animation-delay:4s;"></div>
  <div class="particle" style="left:70%; animation-delay:6s;"></div>
  <div class="particle" style="left:90%; animation-delay:8s;"></div>

  <div class="container fade-in">
    <h1>Location Tracing Dashboard</h1>
    <form id="traceForm">
      <input type="text" id="locationInput" placeholder="Enter location or coordinates">
      <button type="submit">Trace Location</button>
    </form>
    <div id="map"></div>
  </div>

  <script>
    // Initialize map using browser Geolocation + basic canvas
    const mapDiv = document.getElementById('map');
    function showMap(lat, lon){
      mapDiv.innerHTML = `<iframe width="100%" height="100%" 
        style="border:0; border-radius:12px;" 
        src="https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed"></iframe>`;
    }

    // On load, get current position
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(pos=>{
        showMap(pos.coords.latitude, pos.coords.longitude);
      }, ()=>{mapDiv.innerHTML="<p>Unable to access location.</p>";});
    } else {
      mapDiv.innerHTML="<p>Geolocation not supported.</p>";
    }

    // Form submit
    document.getElementById('traceForm').addEventListener('submit', e=>{
      e.preventDefault();
      const val=document.getElementById('locationInput').value.trim();
      if(val){
        showMap(val, val); // If coordinates entered, both lat/lon same string
      }
    });
  </script>
</body>
</html>
